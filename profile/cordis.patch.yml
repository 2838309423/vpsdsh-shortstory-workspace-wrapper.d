# DSH profile「vps」的用户 patch 层（权威副本；落地到 $DSH_HOME/profiles/vps/cordis.patch.yml）
#
# 这个文件就是「服务器上的文本服务 → DSH」的接线处：
#   deepseek-official 路由由 @deepseek-ai/dsh-llm-deepseek 提供，密钥走凭据服务
#   （$DSH_HOME/.credentials.yaml 的 refs.DEEPSEEK_API_KEY，见 bin/apply-profile.sh）。
# 实测（2026-10-08，DSH 0.2.0-rc.2）：
#   - 无密钥时报 `MISSING_CREDENTIAL: llm-deepseek: no API key for provider route "deepseek-official"`；
#   - 存好密钥后 `dsh headless "…"` 返回真实模型答案（模型自报 deepseek-flash）。
# 改这里不需要重启内核？—— 本文件是**用户 patch 层**，DSH 启动时组合；改完重启 `bin/web.sh restart` 最稳。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    # 服务器上的 DeepSeek 文本服务：官方 API + 服务器已有密钥，模型 DeepSeek-V4.1-Flash（1M ctx）
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high
# 写小说是长跑会话（一章一节地攒上下文）：把自动压缩的触发点从默认 ~0.68M token 降到 0.35，
# 压缩后保留最近 ~6% 原文。口径与甲方桌面端一致（见 profiles README）。
- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"
  config:
    thresholdRatio: 0.35
    retainRatio: 0.06
# 浏览器会话 cookie 的寿命：默认 30 天。手机放 30 天不动，cookie 一过期，存的书签（老令牌）
# 就只剩 401，又得重新要链接。调到 10 年 ⇒ 每台设备**认证一次就长期有效**，之后直接开干净 URL
# `http://100.85.190.17:19387/`（不带令牌）。
# ⚠ 用户 patch 层按 id **整条替换** config（2026-10-12 实测：只写 cookieMaxAgeDays 会把 trustedHosts
#   冲掉 ⇒ 手机侧 /api 信任栅栏失守、SPA 打不开）⇒ 必须把 trustedHosts 原样抄回来。
# ⚠ 生效要重启 web（`bash bin/web.sh restart`），重启会换一次入口令牌。
- id: connection
  name: "@deepseek-ai/dsh-client-connection"
  inject:
    - webRuntime
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
    cookieMaxAgeDays: 3650
# 第二个模型路由：智谱 GLM（甲方 2026-10-12 要求：把 GLM 放到「输入框下方模型选择器」的最顶部第一个）。
#   - 路由 key `zai-coding-cn` 就是 pi-ai 自带目录里的智谱国际/国内档（baseURL=https://open.bigmodel.cn/api/coding/paas/v4，
#     OpenAI 兼容）——与甲方 claude 侧走的是**同一把智谱 key**（~/.bashrc 的 ANTHROPIC_API_KEY，经 8199 微代理转发到同域）。
#   - 密钥不进本仓：refs.GLM_API_KEY 由人工写入 $DSH_HOME/.credentials.yaml（600），本文件只写 apiKeyEnv 名字。
#   - `models` 只列 glm-5.3-flash（不写就整个智谱目录 7 个模型都进选择器，flash 会排在中间）；
#     要加 glm-5.3 / glm-5.3-highspeed 就往下补 id（条目字段从 pi-ai 目录同 id 继承，不必重复写 endpoint）。
#   - ⚠ 选择器**分组顺序**是客户端硬编码的（dsh-client-ui-model-selection/lib/client.js 的
#     orderModelProviders()，deepseek-account/official 固定 0/1）⇒ 光配这里，GLM 只会排在 DeepSeek 下面；
#     「排第一」由 `bash bin/patch-model-order.sh apply` 打客户端补丁实现（npm 升级后要重跑）。
#   - ⚠ 本段最早是用 **设置页/设置 RPC** 写活的（`settings/mutate`，立即生效、不重启）；改成手写后要重启 web
#     （`bash bin/web.sh restart`）或再走一次设置页才生效。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      zai-coding-cn:
        apiKeyEnv: GLM_API_KEY
        displayName: 智谱 GLM
        models:
          - id: glm-5.3-flash
